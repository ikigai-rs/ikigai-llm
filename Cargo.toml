[package]
name = "ikigai-llm"
version = "0.12.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "Flexible LLM inference as ikigai ROC resources: urn:llm:ask (a facade grammar) dispatches to pluggable backends. Slice 0 ships an OpenAI-compatible REST backend covering Ollama / vLLM / llama.cpp-server / mlx_lm.server / LM Studio."
repository = "https://github.com/ikigai-rs/ikigai-llm"
homepage = "https://github.com/ikigai-rs/ikigai-llm"
keywords = ["ikigai", "roc", "llm", "inference", "ollama"]
categories = ["web-programming"]

[dependencies]
ikigai-core = "0.1.48" # 0.1.48 = Invocation::trace_note (model-tier span labels)
# The HTTP I/O seam (HttpTransport) + wire types. The host injects one transport
# (ureq/reqwest natively, fetch in the browser) and http + llm share it — no HTTP
# client or executor baked into this crate.
ikigai-http = "0.1.1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the target URL's host for the per-host net capability check (ikigai_http::net_allows).
url = "2"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`). Its own floor on
# ikigai-core (0.1.67) is above the library's; the library's pin above stays the
# true minimum of the API the LIBRARY uses.
ikigai-conformance = "0.2.0"
# NOT imported — a FLOOR. `ikigai-conformance` reaches the vocabulary through
# its own `^0.1.66`, and the VOCABULARY walk over this module's Turtle face is
# only clean from 0.1.69, where `ik:batchAt` was defined (ikigai-core #107).
# Under the looser transitive caret a stale registry index resolves 0.1.66 and
# `a_declared_load_shape_introduces_no_undefined_term` fails on CI alone; this
# line is what makes that resolution impossible. Remove it only when
# `ikigai-conformance`'s own pin states 0.1.69 or later.
ikigai-vocab = "0.1.69"
# A blocking HTTP client for the `ask` example's live smoke test (a real
# HttpTransport against a running Ollama). Dev-only — never in the shipped crate.
ureq = "2"
