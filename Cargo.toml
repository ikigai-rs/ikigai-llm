[package]
name = "ikigai-llm"
version = "0.17.0"
edition = "2021"
# The measured floor (ledger #181), and what the shared CI's msrv job now runs clippy + test
# on. Measured 2026-10-13 on a FRESH resolve, which is what CI builds (Cargo.lock is not
# committed): 1.88 passes both, 1.87 cannot build the graph (icu_* 2.3, reached through
# url -> idna, declares 1.88). A fresh resolve can move this: when a dependency starts
# declaring a newer one, the msrv job goes red and names it, and `cargo metadata` lists
# every package's rust_version.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "Flexible LLM inference as ikigai ROC resources: urn:llm:ask (a facade grammar) dispatches to pluggable backends. Slice 0 ships an OpenAI-compatible REST backend covering Ollama / vLLM / llama.cpp-server / mlx_lm.server / LM Studio."
repository = "https://github.com/ikigai-rs/ikigai-llm"
homepage = "https://github.com/ikigai-rs/ikigai-llm"
keywords = ["ikigai", "roc", "llm", "inference", "ollama"]
categories = ["web-programming"]

[dependencies]
# The LIBRARY's true minimum: 0.1.108, the failure-class release (ledger #1546). This
# crate now returns its new variants (`Refused`, `RetryAfter`, `OverBudget`,
# `Unsupported`, through ikigai-http's status table), reads `Invocation::now` for an
# HTTP-date `Retry-After`, and declares each action's failure classes with
# `Description::fails`, all of which first ship in 0.1.108; ikigai-http 0.3.0 requires it
# too. 0.2.0 is the streams release (ledger #2261); the old "0.1.108" pin meant <0.2.0
# under 0.x rules, so moving to 0.2 is deliberate. Core's types are in this crate's API,
# so the move is breaking for consumers, hence llm 0.17.0. "0.2.0" admits 0.2.x only.
ikigai-core = "0.2.0"
# The HTTP I/O seam (HttpTransport) + wire types. The host injects one transport
# (ureq/reqwest natively, fetch in the browser) and http + llm share it — no HTTP
# client or executor baked into this crate. `net_allows_port` (since 0.1.7) is the
# port-aware gate every outbound call here goes through: under the port-less
# `net_allows` a grant on `localhost:8000` reached `localhost:11434` (ledger #884).
# `auth::bearer` (since 0.2.1, ledger #1857) builds the Authorization header.
# 0.3.0 is the floor because `ikigai_http::status` first ships there: the one table
# from an origin's status (and its `Retry-After`) and a transport failure to an
# ikigai Error (ledger #1546). This crate used to keep a copy of that table, and the
# copy had drifted. HttpTransport is part of THIS crate's public API
# (`space(transport, ..)`), and a host shares one transport between http's space and
# this one, so both must name the same ikigai-http: moving this pin from 0.2 to 0.3 is
# breaking for consumers, hence llm 0.16.0. 0.4.0 is the ikigai-http release on
# ikigai-core 0.2.0 (ledger #2261): with core on 0.2, http must be too or the graph
# links two cores. A ceiling too: "0.4.0" admits 0.4.x only.
ikigai-http = "0.4.0"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the target URL's host and port for the net capability check (ikigai_http::net_allows_port).
url = "2"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`). A 0.x caret is a CEILING
# too: "0.10.0" admits 0.10.x only, so the next minor is a deliberate pin change.
# 0.10.0 brings FAILURES and `Suite::fails_under` (opt-in, turned on here: every
# action is held to the failure classes it declares, and two probes hold the asks to
# `retry-after` under a 429 and `refused` under a 401; ledger #1546), on top of 0.8's
# REQUIRED, 0.7's VALIDATE and 0.6's SPACE-NAME (ledger #987). 0.10 pinned ikigai-core
# and ikigai-vocab at 0.1.108; the vocab floor is what retired this crate's own
# `ikigai-vocab = "0.1.69"` (the `ik:batchAt` term), and the transitive pin states it.
# 0.11.0 is the release on ikigai-core and ikigai-vocab 0.2.0 (the streams release,
# ledger #2261), and turns DATATYPES and FAILURES on by default.
ikigai-conformance = "0.11.0"
# A blocking HTTP client for the `ask` example's live smoke test (a real
# HttpTransport against a running Ollama). Dev-only — never in the shipped crate.
ureq = "2"
